<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión para Billar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10000;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-screen.hidden {
            display: none;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .login-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: none;
        }

        .container.active {
            display: block;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2em;
        }

        .user-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: 600;
            margin-left: 10px;
        }

        .user-badge.admin {
            background: #ffa726;
            color: white;
        }

        .user-badge.employee {
            background: #43e97b;
            color: white;
        }

        .connection-status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .connection-status.connected {
            background: #43e97b;
            color: white;
        }

        .connection-status.disconnected {
            background: #f5576c;
            color: white;
        }

        .main-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .card-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 24px;
        }

        .card-title {
            font-size: 1.5em;
            color: #333;
            font-weight: 600;
        }

        .table-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .table-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .table-item:hover {
            transform: scale(1.05);
        }

        .table-item.occupied {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .table-number {
            font-size: 2em;
            font-weight: bold;
        }

        .table-status {
            font-size: 0.9em;
            margin-top: 5px;
        }

        .table-time {
            font-size: 1.2em;
            margin-top: 10px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 700px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            color: white;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.9em;
            margin-top: 5px;
        }

        .admin-only {
            display: none;
        }

        .admin-only.visible {
            display: block;
        }

        .alert {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .sync-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #43e97b;
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: bold;
            z-index: 999;
            display: none;
        }

        .sync-indicator.syncing {
            display: block;
            background: #ffa726;
        }

        .sync-indicator.success {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">🎱</div>
                <h1>Sistema de Billar</h1>
                <p>Ingresa tus credenciales</p>
            </div>
            
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="loginUsername" placeholder="admin o empleado">
            </div>
            
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            
            <button class="btn btn-primary" id="btnLogin" style="width: 100%; margin: 0;">
                Iniciar Sesión
            </button>

            <div class="alert alert-info" style="margin-top: 20px; font-size: 0.9em;">
                <strong>Usuarios:</strong><br>
                Admin: admin / admin123<br>
                Empleado: empleado / emp123
            </div>
        </div>
    </div>

    <div class="container" id="mainApp">
        <div class="header">
            <div>
                <h1>🎱 Sistema de Billar</h1>
                <p>Usuario: <strong id="currentUser"></strong><span id="userBadge" class="user-badge"></span></p>
            </div>
            <div style="text-align: right;">
                <div id="connectionStatus" class="connection-status disconnected">No Configurado</div>
                <br>
                <button class="btn btn-danger" id="btnLogout">Cerrar Sesión</button>
            </div>
        </div>

        <div class="main-grid">
            <div class="card">
                <div class="card-header">
                    <div class="card-icon">🎱</div>
                    <div class="card-title">Mesas</div>
                </div>
                <div class="table-grid" id="tablesGrid"></div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-icon">📊</div>
                    <div class="card-title">Estadísticas</div>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="activeTables">0</div>
                        <div class="stat-label">Activas</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalRevenue">$0</div>
                        <div class="stat-label">Ingresos</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalSessions">0</div>
                        <div class="stat-label">Sesiones</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-icon">🛒</div>
                    <div class="card-title">Venta Rápida</div>
                </div>
                <div class="form-group">
                    <label>Producto</label>
                    <select id="productSelect">
                        <option value="">Seleccionar</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Cantidad</label>
                    <input type="number" id="productQuantity" value="1" min="1">
                </div>
                <button class="btn btn-success" id="btnQuickSale">Agregar Venta</button>
            </div>

            <div class="card admin-only" id="configCard">
                <div class="card-header">
                    <div class="card-icon">⚙️</div>
                    <div class="card-title">Configuración</div>
                </div>
                <button class="btn btn-primary" id="btnConfigSheets" style="width: 100%;">Configurar Google Sheets</button>
                <button class="btn btn-primary" id="btnManageProducts" style="width: 100%;">Gestionar Productos</button>
                <button class="btn btn-primary" id="btnConfigTables" style="width: 100%;">Configurar Mesas</button>
                <button class="btn btn-primary" id="btnConfigPrices" style="width: 100%;">Configurar Precios</button>
            </div>
        </div>
    </div>

    <div id="tableModal" class="modal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Mesa</div>
            <div id="modalBody"></div>
        </div>
    </div>

    <div class="sync-indicator" id="syncIndicator">Guardando...</div>

    <script>
        const USERS = {
            admin: { password: 'admin123', role: 'admin', name: 'Administrador' },
            empleado: { password: 'emp123', role: 'employee', name: 'Empleado' }
        };

        let currentUser = null;
        let tables = [];
        let sales = [];
        let activeIntervals = {};
        let HOURLY_RATE = 15000;
        let NUM_TABLES = 8;
        let SHEETS_URL = '';
        
        let products = [
            { name: 'Cerveza', price: 5000 },
            { name: 'Gaseosa', price: 3000 },
            { name: 'Agua', price: 2000 },
            { name: 'Snack', price: 4000 }
        ];

        function initAuth() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showMainApp();
            } else {
                showLoginScreen();
            }
        }

        function showLoginScreen() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('mainApp').classList.remove('active');
        }

        function showMainApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.add('active');
            document.getElementById('currentUser').textContent = currentUser.name;
            
            const badge = document.getElementById('userBadge');
            badge.textContent = currentUser.role === 'admin' ? 'Admin' : 'Empleado';
            badge.className = 'user-badge ' + currentUser.role;

            if (currentUser.role === 'admin') {
                document.querySelectorAll('.admin-only').forEach(el => {
                    el.classList.add('visible');
                });
            }

            loadConfig();
            loadTables();
            renderTables();
            renderProductSelect();
        }

        document.getElementById('btnLogin').addEventListener('click', function() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (USERS[username] && USERS[username].password === password) {
                currentUser = {
                    username: username,
                    role: USERS[username].role,
                    name: USERS[username].name
                };
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                showMainApp();
            } else {
                alert('Usuario o contraseña incorrectos');
            }
        });

        document.getElementById('loginPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('btnLogin').click();
            }
        });

        document.getElementById('btnLogout').addEventListener('click', function() {
            if (confirm('¿Cerrar sesión?')) {
                localStorage.removeItem('currentUser');
                currentUser = null;
                showLoginScreen();
            }
        });

        function loadConfig() {
            const savedRate = localStorage.getItem('hourlyRate');
            const savedTables = localStorage.getItem('numTables');
            const savedProducts = localStorage.getItem('products');
            const savedUrl = localStorage.getItem('sheetsUrl');
            
            if (savedRate) HOURLY_RATE = parseInt(savedRate);
            if (savedTables) NUM_TABLES = parseInt(savedTables);
            if (savedProducts) products = JSON.parse(savedProducts);
            if (savedUrl) {
                SHEETS_URL = savedUrl;
                updateConnectionStatus();
            }

            loadSalesData();
        }

        function saveConfig() {
            localStorage.setItem('hourlyRate', HOURLY_RATE);
            localStorage.setItem('numTables', NUM_TABLES);
            localStorage.setItem('products', JSON.stringify(products));
            localStorage.setItem('sheetsUrl', SHEETS_URL);
        }

        function updateConnectionStatus() {
            const statusEl = document.getElementById('connectionStatus');
            if (SHEETS_URL) {
                statusEl.className = 'connection-status connected';
                statusEl.textContent = 'Conectado';
            } else {
                statusEl.className = 'connection-status disconnected';
                statusEl.textContent = 'No Configurado';
            }
        }

        function saveTables() {
            localStorage.setItem('tables', JSON.stringify(tables));
        }

        function loadTables() {
            const saved = localStorage.getItem('tables');
            if (saved) {
                tables = JSON.parse(saved);
                tables.forEach(table => {
                    if (table.occupied && table.startTime) {
                        activeIntervals[table.id] = setInterval(() => {
                            updateTableTime(table.id);
                        }, 1000);
                    }
                });
            } else {
                initTables();
            }
        }

        function saveSalesData() {
            localStorage.setItem('sales', JSON.stringify(sales));
        }

        function loadSalesData() {
            const saved = localStorage.getItem('sales');
            if (saved) {
                sales = JSON.parse(saved);
                sales.forEach(sale => {
                    sale.timestamp = new Date(sale.timestamp);
                });
            }
        }

        function initTables() {
            tables = [];
            for (let i = 1; i <= NUM_TABLES; i++) {
                tables.push({
                    id: i,
                    occupied: false,
                    startTime: null,
                    customers: []
                });
            }
            saveTables();
        }

        function renderTables() {
            const grid = document.getElementById('tablesGrid');
            grid.innerHTML = tables.map(table => `
                <div class="table-item ${table.occupied ? 'occupied' : ''}" data-table-id="${table.id}">
                    <div class="table-number">Mesa ${table.id}</div>
                    <div class="table-status">${table.occupied ? 'Ocupada' : 'Disponible'}</div>
                    ${table.occupied ? `<div class="table-time" id="time-${table.id}">00:00:00</div>` : ''}
                </div>
            `).join('');
            
            document.querySelectorAll('.table-item').forEach(item => {
                item.addEventListener('click', function() {
                    const tableId = parseInt(this.getAttribute('data-table-id'));
                    openTableModal(tableId);
                });
            });
            
            updateStats();
        }

        function openTableModal(tableId) {
            const table = tables.find(t => t.id === tableId);
            const modal = document.getElementById('tableModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            title.textContent = `Mesa ${tableId}`;

            if (!table.occupied) {
                body.innerHTML = `
                    <p style="margin-bottom: 20px;">Mesa disponible</p>
                    <button class="btn btn-primary" id="btnStartTable">Iniciar Mesa</button>
                    <button class="btn btn-danger" id="btnCancelTable">Cancelar</button>
                `;
                
                document.getElementById('btnStartTable').addEventListener('click', () => startTable(tableId));
                document.getElementById('btnCancelTable').addEventListener('click', closeModal);
            } else {
                const elapsed = getElapsedTime(table.startTime);
                const tableCost = calculateCost(elapsed);
                
                let totalProducts = 0;
                table.customers.forEach(customer => {
                    customer.products.forEach(product => {
                        totalProducts += product.total;
                    });
                });
                
                const grandTotal = tableCost + totalProducts;
                
                body.innerHTML = `
                    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
                        <h3 style="text-align: center; margin-bottom: 15px;">RESUMEN GENERAL</h3>
                        <div style="background: rgba(255,255,255,0.2); padding: 15px; border-radius: 8px;">
                            <p><strong>Tiempo:</strong> ${formatTime(elapsed)}</p>
                            <p><strong>Costo Mesa:</strong> $${tableCost.toLocaleString('es-CO')}</p>
                            <p><strong>Productos:</strong> $${totalProducts.toLocaleString('es-CO')}</p>
                            <p style="font-size: 1.3em; margin-top: 10px;"><strong>TOTAL:</strong> $${grandTotal.toLocaleString('es-CO')}</p>
                        </div>
                    </div>

                    <div id="customersList"></div>

                    ${table.customers.length < 4 ? `
                        <button class="btn btn-primary" id="btnAddCustomer" style="width: 100%; margin: 15px 0;">
                            Agregar Cliente
                        </button>
                    ` : ''}

                    <button class="btn btn-success" id="btnEndTable" style="width: 100%; margin-bottom: 10px;">
                        Finalizar y Cobrar - $${grandTotal.toLocaleString('es-CO')}
                    </button>
                    <button class="btn btn-danger" id="btnCloseTableModal">Cerrar</button>
                `;
                
                if (table.customers.length < 4) {
                    document.getElementById('btnAddCustomer').addEventListener('click', () => addCustomerToTable(tableId));
                }
                document.getElementById('btnEndTable').addEventListener('click', () => endTable(tableId));
                document.getElementById('btnCloseTableModal').addEventListener('click', closeModal);
            }

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('tableModal').classList.remove('active');
        }

        function startTable(tableId) {
            const table = tables.find(t => t.id === tableId);
            table.occupied = true;
            table.startTime = Date.now();
            table.customers = [];
            
            activeIntervals[tableId] = setInterval(() => {
                updateTableTime(tableId);
            }, 1000);

            saveTables();
            closeModal();
            renderTables();
        }

        function addCustomerToTable(tableId) {
            const table = tables.find(t => t.id === tableId);
            table.customers.push({ name: '', products: [] });
            saveTables();
            openTableModal(tableId);
        }

        async function endTable(tableId) {
            const table = tables.find(t => t.id === tableId);
            const elapsed = getElapsedTime(table.startTime);
            const tableCost = calculateCost(elapsed);

            let productsTotal = 0;
            table.customers.forEach(customer => {
                customer.products.forEach(product => {
                    productsTotal += product.total;
                });
            });

            const grandTotal = tableCost + productsTotal;

            const saleData = {
                type: 'Mesa',
                item: `Mesa ${tableId}`,
                customers: table.customers,
                time: formatTime(elapsed),
                tableCost: tableCost,
                productsTotal: productsTotal,
                amount: grandTotal,
                timestamp: new Date()
            };

            sales.push(saleData);
            saveSalesData();

            await autoSyncToSheets(saleData);

            clearInterval(activeIntervals[tableId]);
            delete activeIntervals[tableId];

            table.occupied = false;
            table.startTime = null;
            table.customers = [];

            saveTables();
            closeModal();
            renderTables();

            alert('Mesa finalizada y guardada');
        }

        function updateTableTime(tableId) {
            const table = tables.find(t => t.id === tableId);
            if (table && table.occupied) {
                const elapsed = getElapsedTime(table.startTime);
                const element = document.getElementById(`time-${tableId}`);
                if (element) element.textContent = formatTime(elapsed);
            }
        }

        function renderProductSelect() {
            const select = document.getElementById('productSelect');
            select.innerHTML = '<option value="">Seleccionar</option>' +
                products.map(p => 
                    `<option value="${p.name}|${p.price}">${p.name} - $${p.price.toLocaleString('es-CO')}</option>`
                ).join('');
        }

        async function addQuickSale() {
            const select = document.getElementById('productSelect');
            const quantity = parseInt(document.getElementById('productQuantity').value);
            
            if (!select.value || quantity < 1) {
                alert('Selecciona un producto válido');
                return;
            }

            const [product, price] = select.value.split('|');
            const total = parseInt(price) * quantity;

            const saleData = {
                type: 'Venta',
                item: `${product} x${quantity}`,
                amount: total,
                timestamp: new Date()
            };

            sales.push(saleData);
            saveSalesData();

            await autoSyncToSheets(saleData);

            select.value = '';
            document.getElementById('productQuantity').value = '1';
            updateStats();
            
            alert('Venta registrada y guardada');
        }

        document.getElementById('btnQuickSale').addEventListener('click', addQuickSale);

        async function autoSyncToSheets(saleData) {
            if (!SHEETS_URL) return;

            const indicator = document.getElementById('syncIndicator');
            indicator.classList.add('syncing');
            indicator.textContent = 'Guardando...';

            try {
                const response = await fetch(SHEETS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'save_sales',
                        sales: [saleData]
                    })
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    indicator.classList.remove('syncing');
                    indicator.classList.add('success');
                    indicator.textContent = 'Guardado';
                    setTimeout(() => {
                        indicator.classList.remove('success');
                    }, 3000);
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function updateStats() {
            const activeTables = tables.filter(t => t.occupied).length;
            const todaySales = sales.filter(s => isToday(s.timestamp));
            const totalRevenue = todaySales.reduce((sum, s) => sum + s.amount, 0);

            document.getElementById('activeTables').textContent = activeTables;
            document.getElementById('totalRevenue').textContent = `$${totalRevenue.toLocaleString('es-CO')}`;
            document.getElementById('totalSessions').textContent = todaySales.length;
        }

        function getElapsedTime(startTime) {
            return Date.now() - startTime;
        }

        function formatTime(ms) {
            const seconds = Math.floor((ms / 1000) % 60);
            const minutes = Math.floor((ms / (1000 * 60)) % 60);
            const hours = Math.floor(ms / (1000 * 60 * 60));
            return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }

        function pad(num) {
            return num.toString().padStart(2, '0');
        }

        function calculateCost(ms) {
            const hours = ms / (1000 * 60 * 60);
            return Math.ceil(hours * HOURLY_RATE / 1000) * 1000;
        }

        function isToday(date) {
            const today = new Date();
            return date.getDate() === today.getDate() &&
                   date.getMonth() === today.getMonth() &&
                   date.getFullYear() === today.getFullYear();
        }

        document.getElementById('tableModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        document.getElementById('btnConfigSheets').addEventListener('click', function() {
            if (currentUser.role !== 'admin') {
                alert('Solo administradores');
                return;
            }

            const modal = document.getElementById('tableModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            title.textContent = 'Configurar Google Sheets';
            body.innerHTML = `
                <div class="alert alert-info">
                    <strong>Pasos:</strong><br>
                    1. Ve a tu Google Sheet<br>
                    2. Extensiones → Apps Script<br>
                    3. Implementar → Administrar implementaciones<br>
                    4. Copia la URL que termina en /exec
                </div>

                <div class="form-group">
                    <label>URL del Apps Script</label>
                    <input type="text" id="sheetsUrlInput" value="${SHEETS_URL}" 
                           placeholder="https://script.google.com/.../exec">
                </div>

                <button class="btn btn-success" id="btnSaveSheetsUrl">Guardar y Probar</button>
                <button class="btn btn-danger" id="btnCloseModal">Cancelar</button>
            `;
            modal.classList.add('active');

            document.getElementById('btnSaveSheetsUrl').addEventListener('click', saveSheetsUrl);
            document.getElementById('btnCloseModal').addEventListener('click', closeModal);
        });

        async function saveSheetsUrl() {
            const url = document.getElementById('sheetsUrlInput').value.trim();
            
            if (!url) {
                alert('Ingresa la URL');
                return;
            }

            if (!url.endsWith('/exec')) {
                alert('La URL debe terminar en /exec');
                return;
            }

            SHEETS_URL = url;
            saveConfig();
            updateConnectionStatus();

            const testBtn = document.getElementById('btnSaveSheetsUrl');
            testBtn.disabled = true;
            testBtn.textContent = 'Probando...';

            try {
                const response = await fetch(SHEETS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'test' })
                });

                const result = await response.json();
                
                if (result.status === 'success') {
                    alert('Conexión exitosa');
                    closeModal();
                } else {
                    throw new Error('No se pudo conectar');
                }
            } catch (error) {
                alert('Error de conexión. Verifica la URL.');
            } finally {
                testBtn.disabled = false;
                testBtn.textContent = 'Guardar y Probar';
            }
        }

        document.getElementById('btnManageProducts').addEventListener('click', function() {
            if (currentUser.role !== 'admin') {
                alert('Solo administradores');
                return;
            }

            const modal = document.getElementById('tableModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            title.textContent = 'Gestionar Productos';
            body.innerHTML = `
                <div id="productList" style="max-height: 300px; overflow-y: auto; margin-bottom: 20px;"></div>
                
                <div style="padding-top: 20px; border-top: 2px solid #f0f0f0;">
                    <h3 style="margin-bottom: 15px;">Agregar Producto</h3>
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="newProductName" placeholder="Ej: Pizza">
                    </div>
                    <div class="form-group">
                        <label>Precio</label>
                        <input type="number" id="newProductPrice" placeholder="0" min="0" step="500">
                    </div>
                    <button class="btn btn-primary" id="btnAddNewProduct">Agregar</button>
                    <button class="btn btn-danger" id="btnCloseProductsModal">Cerrar</button>
                </div>
            `;
            
            renderProductList();
            modal.classList.add('active');
            
            document.getElementById('btnAddNewProduct').addEventListener('click', addProduct);
            document.getElementById('btnCloseProductsModal').addEventListener('click', closeModal);
        });

        function renderProductList() {
            const list = document.getElementById('productList');
            if (products.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #999;">No hay productos</p>';
                return;
            }
            
            list.innerHTML = products.map((p, idx) => `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #f8f9fa; border-radius: 8px; margin-bottom: 10px;">
                    <div>
                        <strong>${p.name}</strong><br>
                        <span style="color: #667eea;">${p.price.toLocaleString('es-CO')}</span>
                    </div>
                    <button class="btn btn-danger btn-delete-product" data-product-idx="${idx}" style="padding: 8px 15px;">Eliminar</button>
                </div>
            `).join('');
            
            document.querySelectorAll('.btn-delete-product').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.getAttribute('data-product-idx'));
                    deleteProduct(idx);
                });
            });
        }

        function addProduct() {
            const name = document.getElementById('newProductName').value.trim();
            const price = parseInt(document.getElementById('newProductPrice').value);

            if (!name || !price || price < 0) {
                alert('Ingresa nombre y precio válidos');
                return;
            }

            products.push({ name, price });
            saveConfig();
            renderProductList();
            renderProductSelect();
            document.getElementById('newProductName').value = '';
            document.getElementById('newProductPrice').value = '';
            
            alert(`${name} agregado`);
        }

        function deleteProduct(index) {
            const product = products[index];
            if (confirm(`¿Eliminar "${product.name}"?`)) {
                products.splice(index, 1);
                saveConfig();
                renderProductList();
                renderProductSelect();
                alert(`${product.name} eliminado`);
            }
        }

        document.getElementById('btnConfigTables').addEventListener('click', function() {
            if (currentUser.role !== 'admin') return;

            const modal = document.getElementById('tableModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            title.textContent = 'Configurar Mesas';
            body.innerHTML = `
                <div class="form-group">
                    <label>Número de Mesas</label>
                    <input type="number" id="numTablesInput" value="${NUM_TABLES}" min="1" max="20">
                </div>
                <p style="color: #999; margin-bottom: 20px;">
                    Reiniciará el sistema
                </p>
                <button class="btn btn-primary" id="btnUpdateTables">Guardar</button>
                <button class="btn btn-danger" id="btnCancelTables">Cancelar</button>
            `;
            modal.classList.add('active');
            
            document.getElementById('btnUpdateTables').addEventListener('click', updateNumTables);
            document.getElementById('btnCancelTables').addEventListener('click', closeModal);
        });

        function updateNumTables() {
            const newNum = parseInt(document.getElementById('numTablesInput').value);
            if (newNum < 1 || newNum > 20) {
                alert('Entre 1 y 20 mesas');
                return;
            }

            if (confirm('¿Reiniciar mesas?')) {
                Object.keys(activeIntervals).forEach(key => clearInterval(activeIntervals[key]));
                activeIntervals = {};
                NUM_TABLES = newNum;
                saveConfig();
                initTables();
                renderTables();
                closeModal();
                alert(`${newNum} mesas configuradas`);
            }
        }

        document.getElementById('btnConfigPrices').addEventListener('click', function() {
            if (currentUser.role !== 'admin') return;

            const modal = document.getElementById('tableModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');

            title.textContent = 'Configurar Precios';
            body.innerHTML = `
                <div class="form-group">
                    <label>Precio por Hora</label>
                    <input type="number" id="hourlyRateInput" value="${HOURLY_RATE}" min="0" step="1000">
                </div>
                <p style="color: #999; margin-bottom: 20px;">
                    Actual: ${HOURLY_RATE.toLocaleString('es-CO')}/hora
                </p>
                <button class="btn btn-primary" id="btnUpdatePrice">Guardar</button>
                <button class="btn btn-danger" id="btnCancelPrice">Cancelar</button>
            `;
            modal.classList.add('active');
            
            document.getElementById('btnUpdatePrice').addEventListener('click', updateHourlyRate);
            document.getElementById('btnCancelPrice').addEventListener('click', closeModal);
        });

        function updateHourlyRate() {
            const newRate = parseInt(document.getElementById('hourlyRateInput').value);
            if (newRate < 0) {
                alert('El precio debe ser positivo');
                return;
            }
            HOURLY_RATE = newRate;
            saveConfig();
            closeModal();
            alert(`Precio actualizado: ${HOURLY_RATE.toLocaleString('es-CO')}/h`);
        }

        initAuth();
        
        console.log('Sistema de Billar cargado correctamente');
    </script>
</body>
</html>
